serviceName: polyglot-service
runtime: python
environment: dev
replicaCount: 2

image:
  repository: local/polyglot-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: false
  className: ""
  host: ""

annotations: {}
labels: {}
