apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}
    app.kubernetes.io/part-of: polyglot-ci-cd-mesh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.serviceName }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
