name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  polyglot:
    name: ${{ matrix.service }} build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: java
            path: apps/java-service
            image: java-service
          - service: dotnet
            path: apps/dotnet-service
            image: dotnet-service
          - service: node
            path: apps/node-service
            image: node-service
          - service: python
            path: apps/python-service
            image: python-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.service == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up .NET
        if: matrix.service == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node.js
        if: matrix.service == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/node-service/package.json

      - name: Set up Python
        if: matrix.service == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test Java
        if: matrix.service == 'java'
        working-directory: ${{ matrix.path }}
        run: mvn -B test

      - name: Install and test .NET
        if: matrix.service == 'dotnet'
        working-directory: ${{ matrix.path }}
        run: dotnet test

      - name: Install and test Node.js
        if: matrix.service == 'node'
        working-directory: ${{ matrix.path }}
        run: |
          npm install
          npm run lint
          npm test

      - name: Install and test Python
        if: matrix.service == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest

      - name: Build container image
        run: docker build -t local/${{ matrix.image }}:${{ github.sha }} ${{ matrix.path }}

      - name: Write test report
        run: |
          mkdir -p evidence
          printf '{"service":"%s","status":"pass","sha":"%s"}\n' "${{ matrix.service }}" "${{ github.sha }}" > evidence/${{ matrix.service }}-test-report.json

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-report
          path: evidence/${{ matrix.service }}-test-report.json

  repo-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generate_demo_data.py
      - run: python scripts/validate_repo_quality.py
