apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-service-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/pirbod/polyglot-ci-cd-mesh
    targetRevision: main
    path: charts/polyglot-service
    helm:
      valueFiles:
        - values.yaml
        - values-java.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: polyglot-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
