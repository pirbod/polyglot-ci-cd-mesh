apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polyglot-mesh-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pirbod/polyglot-ci-cd-mesh
    targetRevision: main
    path: argo-cd/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
