openapi: 3.0.3
info:
  title: Payments Mesh API
  version: 1.0.0
x-service-metadata:
  owner: platform-payments
  runtime: python
  criticality: high
x-tyk-policy-id: payments-standard-policy
x-tyk-rate-limit:
  rate: 120
  per: minute
servers:
  - url: https://api.example.internal
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - platform
      x-public: true
      responses:
        "200":
          description: OK
  /payments:
    get:
      operationId: listPayments
      tags:
        - payments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payments listed
  /admin/reconcile:
    post:
      operationId: reconcilePayments
      tags:
        - admin
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Reconciliation accepted
